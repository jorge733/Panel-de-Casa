<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101820"><title>Panel de casa</title><link rel="stylesheet" href="styles.css"><script src="app.js" defer></script></head><body><header><b>● CASA</b><div><button id="night">Modo noche</button><button id="settings">Ajustes</button><button id="full">Pantalla completa</button><button id="show-devices" hidden>Control de casa</button><button id="show-calendar" hidden>Calendario</button></div></header><main><section class="left"><p id="hello"></p><time><span id="clock">--:--</span><i id="seconds">--</i></time><p id="date"></p><section><h2>A un toque</h2><div id="shortcuts"></div></section><section class="devices"><div class="heading"><div><h2>Control de casa</h2><p id="lights-status">Conectando con Tuya…</p></div><div class="device-actions"><button id="hide-devices" aria-label="Cerrar control de casa">Cerrar</button><button id="refresh-lights" aria-label="Actualizar dispositivos">↻</button><button id="all-on" class="success">Encender luces</button><button id="all-off" class="danger">Apagar luces</button></div></div><div id="light-list" aria-live="polite"></div></section></section><section class="right"><section class="weather"><div class="heading"><h2>El tiempo</h2><button id="refresh-weather">Actualizar</button></div><strong id="temp">—</strong><b>Santiago de Chile</b><p id="condition">Buscando el tiempo…</p><p id="weather-note"></p><div id="forecast"></div></section><section id="calendar" class="calendar"><div class="heading"><h2>Calendario</h2><div><button id="expand">Ampliar</button><button id="close">Cerrar</button></div></div><p id="calendar-message">Agrega el enlace de tu calendario desde Ajustes.</p><iframe id="calendar-frame" title="Calendario"></iframe></section></section></main><dialog id="dialog"><form id="form" method="dialog"><div class="heading"><h2>Ajustes</h2><button value="cancel">Cerrar</button></div><label>Nombre<input id="name"></label><label>Enlace del calendario<input id="calendar-url" type="url"></label><label>Tema<select id="theme"><option value="verde">Verde</option><option value="azul">Azul</option><option value="calido">Cálido</option></select></label><label>Reloj<select id="clock-size"><option value="normal">Normal</option><option value="grande">Grande</option><option value="compacto">Compacto</option></select></label><label>Modo noche<select id="night-mode"><option value="auto">Automático</option><option value="night">Siempre noche</option><option value="day">Siempre día</option></select></label><button id="save" value="default">Guardar cambios</button></form></dialog><p id="status"></p></body></html>
