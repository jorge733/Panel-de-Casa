<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101820"><title>Panel de casa</title><link rel="stylesheet" href="styles.css"><script src="app.js" defer></script></head>
<body>
<header><span class="brand"><span class="dot"></span> CASA</span><div><button id="fullscreen" type="button">Pantalla completa</button><button id="refresh-weather" type="button">Actualizar clima</button></div></header>
<main>
 <section class="clock" aria-label="Hora y fecha"><p id="greeting">Bienvenido a casa</p><time id="time"><span id="hours-minutes">--:--</span><span id="seconds">--</span></time><p id="date"></p><span class="clock-note">Un momento para estar en casa.</span></section>
 <div class="side"><section class="weather" aria-labelledby="weather-title"><div class="section-heading"><h1 id="weather-title">El tiempo</h1><span class="badge" id="weather-badge">Actualizando</span></div><div class="weather-row"><strong id="temperature">—</strong><div><p id="place">Santiago de Chile</p><p id="condition">Buscando el tiempo…</p></div></div><p class="hint" id="weather-note">Pronóstico automático para Santiago.</p><a class="weather-source" href="https://open-meteo.com/" target="_blank" rel="noopener noreferrer">Datos de Open-Meteo</a></section>
 <section class="quick" aria-labelledby="quick-title"><h2 id="quick-title">A un toque</h2><div class="links"><a href="https://calendar.google.com/" target="_blank" rel="noopener noreferrer"><span>01</span>Calendario <b>↗</b></a><a href="https://keep.google.com/" target="_blank" rel="noopener noreferrer"><span>02</span>Notas <b>↗</b></a><a href="https://www.youtube.com/" target="_blank" rel="noopener noreferrer"><span>03</span>YouTube <b>↗</b></a><a href="https://open.spotify.com/" target="_blank" rel="noopener noreferrer"><span>04</span>Spotify <b>↗</b></a></div></section></div>
</main>
<p id="status" role="status"></p>
</body></html>
