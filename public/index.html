<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101820"><title>Panel de casa</title><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="styles.css"><script src="app.js" defer></script></head><body><header><b>● CASA</b><div><button id="night">Modo noche</button><button id="settings">Ajustes</button><button id="full">Pantalla completa</button><button id="show-calendar" hidden>Calendario</button></div></header><main><section class="left"><p id="hello"></p><time><span id="clock">--:--</span><i id="seconds">--</i></time><p id="date"></p><section><h2>A un toque</h2><div id="shortcuts"></div></section><section id="devices" class="devices" hidden><div class="heading"><div><h2>Control de casa</h2><p id="lights-status">Conectando con Tuya…</p></div><div class="device-actions"><button id="hide-devices" aria-label="Cerrar control de casa">Cerrar</button><button id="refresh-lights" aria-label="Actualizar dispositivos">↻</button><button id="all-on" class="success">Encender luces</button><button id="all-off" class="danger">Apagar luces</button><button id="scene-night">Escena noche</button></div></div><div id="light-list" aria-live="polite"></div></section></section><section class="right"><section class="weather"><div class="heading"><h2>El tiempo</h2><button id="refresh-weather">Actualizar</button></div><div class="weather-main"><strong id="temp">—</strong><div><b>Santiago de Chile</b><p id="condition">Buscando el tiempo…</p></div></div><p id="weather-note"></p><small id="weather-updated"></small><div id="forecast"></div><small class="weather-source">Datos de Open-Meteo</small></section><section id="calendar" class="calendar"><div class="heading"><h2>Calendario</h2><div><button id="expand">Ampliar</button><button id="close">Cerrar</button></div></div><p id="calendar-message">Agrega el enlace de tu calendario desde Ajustes.</p><iframe id="calendar-frame" title="Calendario"></iframe></section></section></main><dialog id="dialog"><form id="form" method="dialog"><div class="heading"><h2>Ajustes</h2><button value="cancel">Cerrar</button></div><label>Nombre<input id="name"></label><label>Enlace del calendario<input id="calendar-url" type="url"></label><section class="shortcut-settings"><div><b>Accesos directos</b><small>Máximo 5: junto a Control de casa completan los 6 accesos.</small></div><div id="shortcuts-config"></div><div class="shortcut-editor-actions"><button id="add-shortcut" type="button">Agregar acceso</button><button id="reset-shortcuts" type="button">Restablecer</button></div></section><label>Tema<select id="theme"><option value="verde">Verde</option><option value="azul">Azul</option><option value="calido">Cálido</option><option value="violeta">Violeta</option><option value="rosa">Rosa</option><option value="gris">Gris</option></select></label><label>Reloj<select id="clock-size"><option value="normal">Normal</option><option value="grande">Grande</option><option value="compacto">Compacto</option></select></label><label>Modo noche<select id="night-mode"><option value="auto">Automático</option><option value="night">Siempre noche</option><option value="day">Siempre día</option></select></label><label>Apagar luces cada día <small>Funciona mientras el panel está abierto.</small><input id="lights-off-time" type="time"></label><section class="backup"><b>Respaldo</b><div><button id="export-settings" type="button">Guardar copia</button><label class="import">Restaurar copia<input id="import-settings" type="file" accept="application/json"></label></div></section><button id="save" value="default">Guardar cambios</button></form></dialog><p id="status"></p></body></html>
